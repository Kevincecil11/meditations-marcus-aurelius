<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf9f7">
<title>Daily Stoic Practice — Meditations</title>
<script>
(function(){
  var t=null;try{t=localStorage.getItem('ma-theme')}catch(e){}
  var map={light:'current',dark:'night'};if(t&&map[t])t=map[t];
  var ok={simple:1,current:1,night:1,mtrx:1,imperial:1,olive:1};
  if(!t||!ok[t]){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches?'night':'current'}
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="themes.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--f-body);background:var(--bg);color:var(--text);line-height:1.7;font-size:17px;-webkit-font-smoothing:antialiased;transition:background 0.25s ease,color 0.25s ease;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.disp{font-family:var(--f-display);font-weight:var(--d-weight);text-transform:var(--d-case);letter-spacing:var(--d-track)}
.hdr{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);transition:background 0.25s ease;padding-top:env(safe-area-inset-top)}
.hdr-inner{max-width:760px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hdr-brand{font-family:var(--f-display);font-weight:var(--d-weight);text-transform:var(--d-case);letter-spacing:var(--d-track);font-size:1.12rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hdr-btn{display:flex;align-items:center;justify-content:center;min-height:38px;padding:8px 12px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg-surface);color:var(--accent);cursor:pointer;font-family:inherit;font-size:0.8rem;font-weight:600;gap:5px;transition:all 150ms;white-space:nowrap;text-decoration:none}
.hdr-btn:hover{background:var(--accent-bg);border-color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 80px}
.tabs{display:flex;gap:6px;padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:28px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:inherit;font-size:0.82rem;font-weight:600;padding:9px 18px;border-radius:999px;border:1px solid var(--border);background:var(--bg-surface);color:var(--text-muted);cursor:pointer;transition:all 150ms;white-space:nowrap;min-height:40px}
.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.on{background:var(--mode-active-bg);color:var(--mode-active-text);border-color:var(--mode-active-bg)}
.sec{display:none}
.sec.active{display:block}
.today-header{text-align:center;padding:16px 0 28px}
.today-ey{font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.today-day{font-size:2rem;margin-bottom:4px;line-height:1.2}
.today-sub{font-size:0.85rem;color:var(--text-muted)}
.reading-card{background:var(--bg-card);border-radius:calc(var(--r) + 4px);padding:32px;margin-bottom:20px;transition:background 0.25s ease}
.reading-label{font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.reading-quote{font-family:var(--f-quote);font-size:1.2rem;font-style:var(--q-style);line-height:1.65;color:var(--text);margin-bottom:10px}
.reading-src{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:0.78rem;font-weight:500;color:var(--text-light);margin-bottom:20px}
.reading-section h4{font-size:0.72rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.reading-section p{font-size:0.95rem;line-height:1.8;color:var(--text-mid)}
.action-card{background:var(--accent-bg);border:1px solid var(--accent);border-radius:var(--r);padding:20px 24px;margin-bottom:20px}
.action-card h4,.reflection-card h4{font-size:0.72rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.action-card p{font-size:0.95rem;line-height:1.75;color:var(--text)}
.reflection-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r);padding:20px 24px;margin-bottom:20px}
.reflection-card textarea{width:100%;min-height:96px;font-family:inherit;font-size:16px;line-height:1.7;color:var(--text);background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px;resize:vertical;outline:none;transition:border-color 150ms}
.reflection-card textarea::placeholder{color:var(--text-light)}
.reflection-card textarea:focus{border-color:var(--accent)}
.done-btn{display:block;width:100%;padding:15px;border-radius:var(--r);border:none;background:var(--mode-active-bg);color:var(--mode-active-text);font-family:inherit;font-size:0.92rem;font-weight:700;cursor:pointer;transition:opacity 150ms;margin-bottom:14px}
.done-btn:hover{opacity:0.9}
.done-btn.completed{background:var(--done-bg);color:var(--done-text);border:1px solid var(--done-border);cursor:default}
.nav-btns{display:flex;gap:8px;justify-content:space-between}
.nav-btn{flex:1;padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-surface);color:var(--text-muted);font-family:inherit;font-size:0.82rem;font-weight:600;cursor:pointer;transition:all 150ms;text-align:center}
.nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.cal-head{font-size:0.72rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);margin:6px 0 10px}
.cal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-bottom:28px}
.cal-card{padding:14px 10px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg-surface);text-align:center;cursor:pointer;transition:all 150ms;font:inherit;color:inherit}
.cal-card:hover{border-color:var(--accent);background:var(--accent-bg)}
.cal-card.today-card{border-color:var(--accent);background:var(--accent-bg)}
.cal-card.done-card{border-color:var(--done-border);background:var(--done-bg)}
.cal-num{font-family:var(--f-display);font-weight:var(--d-weight);font-size:1.35rem;color:var(--text);margin-bottom:2px;line-height:1.2}
.cal-card.done-card .cal-num,.cal-card.done-card .cal-status{color:var(--done-text)}
.cal-status{font-size:0.68rem;font-weight:600;color:var(--text-light);min-height:1em}
.cal-card.today-card .cal-status{color:var(--accent)}
.progress-bar-wrap{margin-bottom:28px}
.progress-label{display:flex;justify-content:space-between;font-size:0.78rem;font-weight:600;color:var(--text-muted);margin-bottom:6px}
.progress-track{height:8px;background:var(--bg-card);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width 0.4s ease}
.toolkit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:32px}
.toolkit-card{padding:20px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg-surface);cursor:pointer;transition:all 150ms;text-align:left;font:inherit;color:inherit}
.toolkit-card:hover{border-color:var(--accent);background:var(--accent-bg)}
.toolkit-icon{font-size:1.6rem;margin-bottom:8px}
.toolkit-title{font-size:0.95rem;font-weight:700;margin-bottom:4px;color:var(--text)}
.toolkit-desc{font-size:0.82rem;color:var(--text-muted);line-height:1.5}
.toolkit-detail{display:none}
.toolkit-detail.active{display:block}
.toolkit-back{font-family:inherit;font-size:0.85rem;font-weight:600;color:var(--accent);background:none;border:none;cursor:pointer;padding:6px 0;margin-bottom:16px}
.toolkit-detail h2{font-size:1.5rem;margin-bottom:6px;line-height:1.3}
.toolkit-detail .tk-desc{font-size:0.9rem;color:var(--text-muted);margin-bottom:14px;line-height:1.7}
.tk-sym{margin-bottom:20px}
.tk-passage{padding:20px;background:var(--bg-card);border-radius:var(--r);margin-bottom:12px;transition:background 0.25s ease}
.tk-passage .tkq{font-family:var(--f-quote);font-size:1.05rem;font-style:var(--q-style);line-height:1.65;color:var(--text);margin-bottom:8px}
.tk-passage .tks{font-size:0.75rem;font-weight:600;color:var(--text-light);margin-bottom:10px}
.tk-passage .tka{font-size:0.92rem;line-height:1.75;color:var(--text-mid)}
.ft{max-width:760px;margin:0 auto;padding:36px 20px calc(48px + env(safe-area-inset-bottom));border-top:1px solid var(--border);text-align:center}
.ft p{font-size:0.75rem;font-weight:500;color:var(--text-light)}
@media(max-width:768px){body{font-size:16px}.reading-card{padding:24px 18px}.reading-quote{font-size:1.06rem}.action-card,.reflection-card{padding:18px}.today-day{font-size:1.6rem}}
@media(max-width:640px){.hdr-inner{padding:8px 14px}.hdr-btn .lbl{display:none}.hdr-btn{padding:8px 10px;min-width:40px}.wrap{padding:0 16px 60px}.tab{padding:8px 14px;font-size:0.8rem}.toolkit-grid{grid-template-columns:1fr 1fr;gap:10px}.toolkit-card{padding:14px}.toolkit-desc{font-size:0.78rem}.cal-grid{grid-template-columns:repeat(5,1fr);gap:6px}.cal-card{padding:10px 4px}.cal-num{font-size:1.1rem}.cal-status{font-size:0.6rem}}
@media(max-width:400px){.toolkit-grid{grid-template-columns:1fr}.nav-btns{flex-direction:column}.hdr-brand{font-size:0.98rem}}
</style>
</head>
<body>
<header class="hdr"><div class="hdr-inner">
<a href="practice.html" class="hdr-brand">Daily Stoic Practice</a>
<div class="hdr-right">
<a href="index.html" class="hdr-btn" title="Full book">&#9776; <span class="lbl">Book</span></a>
<button class="hdr-btn" data-open-gallery title="Symbols">&#9672; <span class="lbl">Symbols</span></button>
<button class="hdr-btn" id="themeBtn" title="Change theme">&#9680; <span class="lbl">Theme</span></button>
</div>
</div></header>
<div class="wrap">
<div class="tabs">
<button class="tab on" data-tab="today">Today's Reading</button>
<button class="tab" data-tab="calendar" id="calTab">Calendar</button>
<button class="tab" data-tab="toolkit">Emergency Toolkit</button>
</div>
<div class="sec active" id="sec-today">
<div class="today-header">
<div class="today-ey">Morning Practice</div>
<div class="today-day disp" id="todayTitle"></div>
<div class="today-sub" id="todaySub"></div>
</div>
<div id="todayContent"></div>
</div>
<div class="sec" id="sec-calendar">
<div class="today-header">
<div class="today-ey">Your Progress</div>
<div class="today-day disp" id="calTitle">Your Journey</div>
<div class="today-sub">One reading per day. The cycle repeats when you finish.</div>
</div>
<div class="progress-bar-wrap">
<div class="progress-label"><span id="progText"></span><span id="progPct">0%</span></div>
<div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
</div>
<div id="calGrid"></div>
</div>
<div class="sec" id="sec-toolkit">
<div class="today-header">
<div class="today-ey">When You Need It</div>
<div class="today-day disp">Emergency Toolkit</div>
<div class="today-sub">Tap what you are feeling right now.</div>
</div>
<div class="toolkit-grid" id="tkGrid"></div>
<div class="toolkit-detail" id="tkDetail"></div>
</div>
</div>
<footer class="ft"><p>Based on Meditations by Marcus Aurelius (George Long Translation, 1862)</p><span class="mtrx-credit">Designed by <b>MTRX&trade;</b></span></footer>
<script src="theme.js"></script>
<script src="practice-data.js"></script>
<script src="practice.js"></script>
<script src="toolkit-extra.js"></script>
</body>
</html>
